<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis for Financial News</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    
    <style>
        /* General Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background: rgba(83, 153, 183, 0.76);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Newspaper Full-Screen Cover */
        .newspaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://media0.giphy.com/media/ROwhM7uP2HFOiHGBeA/giphy.gif') no-repeat center center;
            background-size: cover;
            cursor: pointer;
            transition: transform 1s ease-in-out, opacity 1s ease-in-out;
            z-index: 10;
        }
        .newspaper.open {
            transform: scale(1.1) rotateY(180deg);
            opacity: 0;
        }

        /* Container */
        .container {
            opacity: 0; /* Initially hidden */
            pointer-events: none; /* Prevent interaction */
            width: 80%;
            max-width: 1000px;
            padding: 30px;
            background: rgba(62, 151, 50, 0.69);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(28, 161, 68, 0.5);
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-rows: auto auto auto;
            gap: 20px;
            transition: opacity 1s ease-in-out;
        }

        /* Title */
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px 10px rgba(255, 204, 0, 0.7);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* Textarea */
        #newsInput {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            outline: none;
            resize: none;
            background: #fff;
            color: #333;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        /* Upload Section */
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .upload-label {
            display: inline-block;
            background: #ffcc00;
            padding: 10px 20px;
            border-radius: 8px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }
        .upload-label:hover {
            background: #ffaa00;
        }
        input[type="file"] {
            display: none;
        }

        /* Button Styles */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(45deg, #ff6600, #ff3300);
            border: none;
            color: white;
            font-size: 1.2em;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(255, 102, 0, 0.5);
        }
        button:hover {
            background: linear-gradient(45deg, #ff3300, #cc0000);
            transform: scale(1.05);
        }

        /* Result Section */
        #result {
            display: none;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            text-align: center;
        }
        #result h2 {
            font-size: 1.8rem;
            color: #ffcc00;
        }
        #sentiment {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
        }

    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const newspaper = document.querySelector(".newspaper");
            const container = document.querySelector(".container");
            const predictBtn = document.getElementById("predictBtn");

            newspaper.addEventListener("click", function() {
                newspaper.classList.add("open");

                setTimeout(() => {
                    newspaper.style.display = "none"; // Hide GIF completely
                    container.style.opacity = "1"; // Fade in interface
                    container.style.pointerEvents = "auto"; // Enable interaction
                }, 1000); // Wait for GIF to fade out
            });

            predictBtn.addEventListener("click", function() {
                window.location.href = "/predictpage";
            });
        });
    </script>
</head>
<body>
    <div class="newspaper"></div>
    
    <div class="container">
        <h1 class="title">📊 Sentiment Analysis for Financial News</h1>
        
        <label for="newsInput">Enter Financial News Article:</label>
        <textarea id="newsInput" placeholder="Paste financial news article here..."></textarea>

        <div class="upload-section">
            <input type="file" id="uploadFile" accept=".txt,.pdf">
            <label for="uploadFile" class="upload-label"><i class="fas fa-upload"></i> Upload Article</label>
        </div>

        <div class="button-group">
            <button id="predictBtn"><i class="fas fa-chart-line"></i> Predict Sentiment</button>
            <button id="clearBtn"><i class="fas fa-trash"></i> Clear</button>
        </div>

        <div id="result">
            <h2><i class="fas fa-poll"></i> Prediction Result:</h2>
            <p id="sentiment"></p>
        </div>
    </div>
</body>
</html>
