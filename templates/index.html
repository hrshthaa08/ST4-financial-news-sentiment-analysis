<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis for Financial News</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a1a;
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .newspaper {
            width: 300px;
            height: 400px;
            background: url('https://media.giphy.com/media/ROwhM7uP2HFOiHGBeA/giphy.gif') ;
            background-size: cover;
            position: absolute;
            cursor: pointer;
            transition: transform 1s ease-in-out;
            transform-origin: center;
        }
        .newspaper.open {
            animation: unfold 1s forwards;
        }
        @keyframes unfold {
            0% { transform: scale(1) rotateY(0deg); }
            50% { transform: scale(1.1) rotateY(90deg); }
            100% { transform: scale(1) rotateY(180deg); opacity: 0; }
        }
        .container {
            display: none;
            margin: 20px auto;
            padding: 20px;
            width: 50%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        button {
            background: linear-gradient(45deg, #ff6600, #ff3300);
            border: none;
            color: white;
            font-size: 1.2em;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(255, 102, 0, 0.5);
        }
        button:hover {
            background: linear-gradient(45deg, #ff3300, #cc0000);
            transform: scale(1.05);
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const newspaper = document.querySelector(".newspaper");
            const container = document.querySelector(".container");
            newspaper.addEventListener("click", function() {
                newspaper.classList.add("open");
                setTimeout(() => {
                    newspaper.style.display = "none";
                    container.style.display = "block";
                }, 1000);
            });
        });
    </script>
</head>
<body>
    <div class="newspaper"></div>
    <div class="container">
        <h1 class="title">Sentiment Analysis for Financial News</h1>
        <label for="newsInput">Enter Financial News Article:</label>
        <textarea id="newsInput" class="news-animation" placeholder="Paste financial news article here..."></textarea>
        <div class="upload-section">
            <input type="file" id="uploadFile" accept=".txt,.pdf">
            <label for="uploadFile" class="upload-label"><i class="fas fa-upload"></i> Upload Article</label>
        </div>
        <button id="analyzeBtn"><i class="fas fa-search"></i> Analyze Sentiment</button>
        <button id="clearBtn"><i class="fas fa-trash"></i> Clear</button>
        <div id="result" class="hidden">
            <h2><i class="fas fa-poll"></i> Analysis Result:</h2>
            <p id="sentiment"></p>
        </div>
    </div>
</body>
</html>
