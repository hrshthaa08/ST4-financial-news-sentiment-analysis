<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis for Financial News</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
        }
        .container {
            position: relative;
            z-index: 1;
            width: 80%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.2);
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .title {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .description {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .predict-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff7eb3, #ff758c);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
            box-shadow: 0px 5px 15px rgba(255, 118, 136, 0.4);
        }
        .predict-btn:hover {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            transform: scale(1.1);
        }
        .result {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 20px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="title">Sentiment Analysis for Financial News</div>
        <p class="description">Sentiment analysis in finance helps identify market trends, analyze investor emotions, and make data-driven trading decisions.</p>
        <button class="predict-btn" onclick="predictSentiment()">Predict Sentiment</button>
        <div class="result" id="result">Positive</div>
    </div>

    <script>
        function predictSentiment() {
            const sentiments = ['Positive', 'Negative', 'Neutral'];
            const result = document.getElementById("result");
            let randomSentiment = sentiments[Math.floor(Math.random() * sentiments.length)];
            result.innerHTML = randomSentiment;
            gsap.to(result, { opacity: 1, scale: 1.2, duration: 0.5, yoyo: true, repeat: 1 });
        }

        gsap.from(".title", { opacity: 0, y: -50, duration: 1, ease: "power2.out" });
        gsap.from(".description", { opacity: 0, y: 50, duration: 1, delay: 0.5, ease: "power2.out" });
        gsap.from(".predict-btn", { opacity: 0, scale: 0, duration: 1, delay: 1, ease: "elastic.out(1, 0.5)" });
    </script>
</body>
</html>
